name: Release Workflow

on:
  push:
    branches:
      - Preview
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: google-github-actions/release-please-action@v4
        with:
          release-type: simple
          package-name: .
          changelog-types: >-
            [
              {"type":"feat","section":"✨ Features"},
              {"type":"fix","section":"🐛 Bug Fixes"},
              {"type":"docs","section":"📝 Documentation"},
              {"type":"chore","section":"🧹 Chores","hidden":true}
            ]

  build-and-upload:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get version from .release-please-manifest.json
        id: get_version
        run: |
          VERSION=$(jq -r '."."' .release-please-manifest.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create zip archive
        run: |
          zip -r my-project-${VERSION}.zip ./*

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.release-please.outputs.tag-name }}
          files: Release_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit-changelog:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          echo "Default branch is $DEFAULT_BRANCH"

          git fetch origin $DEFAULT_BRANCH
          git checkout $DEFAULT_BRANCH
          git pull origin $DEFAULT_BRANCH

          if [ -f CHANGELOG.md ]; then
            git add CHANGELOG.md
            git commit -m "chore: update CHANGELOG.md for release ${{ needs.release-please.outputs.tag-name }}" || echo "No changes to commit"
            git push origin $DEFAULT_BRANCH
          else
            echo "No CHANGELOG.md generated."
          fi
